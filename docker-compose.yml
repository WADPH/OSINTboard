# OSINTboard — Docker Compose installation.
#
#   docker compose up -d --build     # build and start
#   docker compose logs -f           # follow logs
#   docker compose down              # stop (data stays in the folders below)
#
# The app is served at http://localhost:8080 (override with OSINTBOARD_PORT).
#
# Data lives in bind-mounted folders next to this file (git-ignored):
#   ./osintboard-data/     graphs database (SQLite) + uploaded attachments
#   ./osintboard-results/  maigret scan results and PDF reports
# Back up both folders to back up everything.

name: osintboard

services:
  backend:
    build:
      context: ./backend
    environment:
      # A container should stay up between scans.
      OSINTBOARD_IDLE_TIMEOUT: "0"
      PORT: "8000"
      OSINTBOARD_DATA_DIR: /app/data
      # Max size of one attachment upload (nginx allows up to 110 MB)
      OSINTBOARD_MAX_MEDIA_MB: "100"
    volumes:
      # Graphs database + attachment files.
      - ./osintboard-data/:/app/data
      # Scan results and PDFs survive restarts/redeploys.
      - ./osintboard-results/:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      args:
        # Standalone Docker deployment is mounted at the server root.
        VITE_BASE_PATH: /
    ports:
      - "${OSINTBOARD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
